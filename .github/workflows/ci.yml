name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  python:
    name: Python — parse & smoke tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check (compileall)
        run: python -m compileall -q app/ run.py

      - name: Smoke tests
        run: python -m pytest tests/ -v
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production

  javascript:
    name: JavaScript — syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check JS files parse
        run: |
          shopt -s globstar nullglob
          failed=0
          for f in app/static/js/**/*.js; do
            if ! node --check "$f" 2>&1; then
              echo "::error file=$f::JS syntax error"
              failed=1
            fi
          done
          exit $failed

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # gitleaks-action requires a paid license for org-owned repos.
      # We install the upstream open-source binary directly — no license needed.
      - name: Install gitleaks
        run: |
          VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks
          gitleaks version

      # --config : les règles maison de .gitleaks.toml. Sans elles, le jeu par
      # défaut ne voit que les marqueurs PEM et laisse passer une clé privée
      # encodée en base64 dans un champ JSON — c'est exactement ce qui a permis
      # à une clé de compte Let's Encrypt de traverser un an d'historique avec
      # un CI au vert.
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose

  version:
    name: Version matches tag
    runs-on: ubuntu-latest
    # Uniquement sur un tag : ailleurs il n'y a rien à comparer.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # La version affichée est normalement dérivée du tag — par substitution
      # git archive pour une release téléchargée, par `git describe` pour un
      # clone. __version__ n'est qu'un repli de dernier recours, mais un repli
      # faux resterait invisible : ce garde-fou l'interdit.
      - name: Compare __version__ with the pushed tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          DECLARED=$(python3 -c "import re,pathlib; \
            print(re.search(r'^__version__ = \"([^\"]+)\"', \
            pathlib.Path('app/utils/version_utils.py').read_text(), re.M).group(1))")
          echo "tag=$TAG  __version__=$DECLARED"
          if [ "$TAG" != "$DECLARED" ]; then
            echo "::error::__version__ ($DECLARED) ne correspond pas au tag ($TAG)."
            echo "Mettre à jour __version__ dans app/utils/version_utils.py."
            exit 1
          fi

      # Vérifie que la substitution fonctionne réellement dans une archive,
      # plutôt que de la supposer.
      - name: Check archive substitution
        run: |
          git archive --format=tar "$GITHUB_REF_NAME" -- app/utils/_version.txt \
            | tar -xO app/utils/_version.txt > /tmp/version.txt
          ARCHIVED=$(cat /tmp/version.txt)
          echo "archive → $ARCHIVED"
          # `if` plutôt que `grep && { … }` : le AND-list renvoie l'échec de
          # grep, donc le step tomberait précisément dans le cas nominal où le
          # jeton A bien été substitué. Les conditions de `if` échappent au -e.
          if [ "${ARCHIVED#\$Format:}" != "$ARCHIVED" ]; then
            echo "::error::export-subst n'a pas substitué le jeton — vérifier .gitattributes"
            exit 1
          fi
          if [ "$ARCHIVED" != "$GITHUB_REF_NAME" ]; then
            echo "::error::archive=$ARCHIVED ≠ tag=$GITHUB_REF_NAME"
            exit 1
          fi

  # Publication automatique de la release au push d'un tag `v*`.
  # `needs` couvre tous les contrôles : un tag qui casse les tests, contient un
  # secret ou déclare une version incohérente ne produit pas de release.
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, javascript, secrets, version]
    # Le workflow est en `contents: read` par défaut ; seul ce job a besoin
    # d'écrire pour créer la release et téléverser l'archive.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Même archive que celle produite à la main jusqu'ici : `git archive`
      # avec le préfixe `wp-launcher-X.Y.Z/`, ce qui déclenche aussi la
      # substitution export-subst de `_version.txt`.
      - name: Build source archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz \
            --prefix="wp-launcher-${VERSION}/" \
            -o "wp-launcher-${VERSION}.tar.gz" \
            "$GITHUB_REF_NAME"
          ls -l "wp-launcher-${VERSION}.tar.gz"

      # Les notes proviennent de la section correspondante du CHANGELOG, qui
      # est déjà rédigée. Si la section est absente, on retombe sur les notes
      # générées par GitHub plutôt que de publier une release vide.
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/       { exit }
            found                   { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ -s notes.md ]; then
            echo "  section trouvée ($(wc -l < notes.md) lignes)"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Aucune section [$VERSION] dans CHANGELOG.md — notes générées par GitHub"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARGS=(--title "$GITHUB_REF_NAME")
          if [ "${{ steps.notes.outputs.generated }}" = "true" ]; then
            ARGS+=(--generate-notes)
          else
            ARGS+=(--notes-file notes.md)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${ARGS[@]}" \
            "wp-launcher-${VERSION}.tar.gz"
